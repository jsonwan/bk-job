# AIDEV Agent Package 清单
# 作用：声明本次需要同步到 AIDEV 平台的资源，每一项对应目录下的一个文件或目录。
# 同步方式：由 job-sync-bk-aidev 镜像在部署阶段执行 bkai-cli validate / sync（见 bin/sync-bkaidev.sh）。
apiVersion: bkai.tencent.com/v1
kind: AgentPackage

metadata:
  name: bk-job
  version: "1.0.0"

# 注意：resources 中列出的路径必须真实存在，否则 bkai-cli validate 会失败。
# 因此 Skill 与知识库暂不在此声明，待对应目录准备好内容后再取消注释。
resources:
  - agents/bk_job_ai.yaml
  - knowledgebases/bk-job-user-guide
  # - skills/job_skill
