{{- if .Values.bkAidevConfig.sync }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.names.fullname" . }}-sync-bk-aidev-{{ .Chart.Version }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: "job-sync-bk-aidev"
    {{ include "job.labelKeys.imageTag" . }} : {{ .Values.bkAidevConfig.image.tag | quote }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 2
  parallelism: 1
  template:
    metadata:
      labels: {{- include "common.labels.matchLabels" . | nindent 8 }}
        app.kubernetes.io/component : "job-sync-bk-aidev"
    spec:
      {{- include "job.imagePullSecrets" . | nindent 6 }}
      containers:
      - command:
        - bash
        args:
        - bin/sync-bkaidev.sh
        image: {{ include "job-sync-bk-aidev.image" . }}
        imagePullPolicy: {{ .Values.bkAidevConfig.image.pullPolicy }}
        resources:
          {{- toYaml .Values.bkAidevConfig.resources | nindent 10 }}
        name: job-sync-bk-aidev
        env:
        # bkai-cli 调用 AIDEV 应用态接口需要应用身份，直接复用作业平台自身的 appCode/appSecret
        - name: BK_APP_CODE
          value: {{ .Values.appCode }}
        - name: BK_APP_SECRET
          value: {{ .Values.appSecret }}
        - name: BK_APP_TENANT_ID
          value: {{ if .Values.tenant.enabled }}"system"{{ else }}"default"{{ end }}
        # TODO 待确认：bkai-cli 访问 AIDEV 接口所需的地址及其环境变量名，按 AIDEV 平台文档补全
        - name: BK_AIDEV_API_URL
          value: {{ .Values.bkAidevConfig.url | quote }}
        - name: BK_AIDEV_SPACE
          value: {{ .Values.bkAidevConfig.space | quote }}
        - name: BK_AIDEV_MANIFEST_FILE
          value: {{ .Values.bkAidevConfig.manifestFile | quote }}
        # 需要跳过同步的资源，格式为 Kind/code，多个以空格分隔
        - name: BK_AIDEV_EXCLUDE_RESOURCES
          value: {{ .Values.bkAidevConfig.excludeResources | quote }}
        # Agent 引用的 MCP Server 由网关同步任务异步注册，这里通过有限重试等待其就绪
        - name: BK_AIDEV_SYNC_MAX_RETRY
          value: {{ .Values.bkAidevConfig.syncMaxRetry | quote }}
        - name: BK_AIDEV_SYNC_RETRY_INTERVAL
          value: {{ .Values.bkAidevConfig.syncRetryInterval | quote }}
      restartPolicy: Never
{{- end }}
